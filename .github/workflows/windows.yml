name: Windows

# Construit revise.exe. Sur une étiquette « v… », l'exécutable est publié dans une Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install ".[dev]" pyinstaller
      - name: Tests
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Construction de revise.exe
        run: pyinstaller --noconfirm --onefile --windowed --name revise --paths src packaging/revise_gui.py
      - name: Vérification du démarrage
        shell: pwsh
        run: |
          $p = Start-Process dist/revise.exe -ArgumentList '--selftest' -Wait -PassThru
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: revise-windows
          path: dist/revise.exe
      - name: Publication
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/revise.exe --title "revise $GITHUB_REF_NAME" \
            --notes "Télécharge revise.exe et lance-le. Au premier lancement, Windows affiche « éditeur inconnu » : clique sur « Informations complémentaires » puis « Exécuter quand même »."
        env:
          GH_TOKEN: ${{ github.token }}
