[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revise"
version = "0.5.0"
description = "Révision espacée (FSRS) à partir de CM en PDF"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5",
    "textual>=1.0",
    "rich>=13",
    "fsrs>=6.3,<7",
    "PySide6-Essentials>=6.6",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
revise = "revise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
